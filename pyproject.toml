[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-uav-interaction"
version = "0.1.0"
description = "Multi-UAV artificial wind interaction and shared payload in MuJoCo/PX4 SITL"
requires-python = ">=3.12"
dependencies = ["mujoco==3.6.0", "numpy>=2.0", "matplotlib>=3.8", "lxml>=4.9", "pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dual-uav = "dual_uav_interaction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dual_uav_interaction = ["assets/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
